<div class="panel-card">
  <div class="panel-header">
    <div class="panel-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
      Target Address
    </div>
    <span class="badge badge-blue">Verified</span>
  </div>

  <div style="font-family: monospace; font-size: 0.85rem; word-break: break-all; color: var(--text-main); margin-bottom: 8px;">
    {{ summary.address }}
  </div>

  <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
    {% for eco in summary.detected_ecosystems %}
      <span class="badge badge-purple">{{ eco | upper }}</span>
    {% endfor %}
  </div>

  <div class="stat-grid">
    <div class="stat-box">
      <div class="stat-label">Transactions</div>
      <div class="stat-value">{{ summary.transaction_count }}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Total Volume (ETH/BTC)</div>
      <div class="stat-value">{{ summary.total_volume_native }}</div>
    </div>
  </div>
</div>
